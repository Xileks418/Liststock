<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Pricelist Harian - Ardistore</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #00a9a5;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #007c7a;
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }
    .title, .subtitle, .plan-title {
      text-align: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }
    .plan-title {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 600;
      color: #fafffa;
    }
    .area-list {
      margin-top: 20px;
    }
    .area-item {
      background: #009e9a;
      border-radius: 10px;
      margin: 5px 0;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      transition: transform 0.3s;
      touch-action: pan-y;
      position: relative;
    }
    .area-item span {
      flex: 1;
      margin: 0 5px;
      outline: none;
      font-size: 18px;
    }
    .area-item input {
      background: transparent;
      border: none;
      color: white;
      outline: none;
      width: 70px;
      font-size: 18px;
      text-align: right;
    }
    .trash-icon {
      position: absolute;
      right: -50px;
      top: 0;
      height: 100%;
      width: 50px;
      background: red;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      transition: right 0.3s;
    }
    .area-item.show-trash .trash-icon {
      right: 0;
    }
    .add-button {
      margin-top: 15px;
      background: #ffffff22;
      border: 1px solid #ffffff55;
      border-radius: 12px;
      padding: 10px 20px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: block;
      width: 100%;
    }
    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #ddd;
    }
    .loading-button {
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container" id="capture">
    <div class="title" contenteditable="true" id="judul">Pricelist Harian</div>
    <div class="subtitle" contenteditable="true" id="subjudul">Edit daftar harga sesuai kebutuhan</div>
    <div class="plan-title" contenteditable="true" id="kategori">SUPERBIG 1 HARI</div>

    <div class="area-list" id="areaList"></div>

    <button class="add-button" onclick="addColumn()">➕ Ardistore</button>
    <button class="add-button" onclick="exportAsImage()" id="exportButton">🖼️ Ekspor ke Gambar</button>

    <div class="footer">ARDISTORE</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    let touchStartX = 0;

    function startSwipe(e) {
      touchStartX = e.touches[0].clientX;
    }

    function moveSwipe(e) {
      const touchEndX = e.touches[0].clientX;
      const diff = touchStartX - touchEndX;
      const item = e.target.closest(".area-item");
      if (diff > 50) {
        item.classList.add("show-trash");
      } else if (diff < -20) {
        item.classList.remove("show-trash");
      }
    }

    function addColumn(data = { area: '⭐ AREA BARU', kuota: '0 GB', harga: '0' }) {
      const item = document.createElement("div");
      item.className = "area-item";
      item.setAttribute("ontouchstart", "startSwipe(event)");
      item.setAttribute("ontouchmove", "moveSwipe(event)");
      item.innerHTML = `
        <span contenteditable="true" oninput="saveData()">${data.area}</span>
        <span contenteditable="true" oninput="saveData()">${data.kuota}</span>
        <input type="number" value="${data.harga}" oninput="saveData()" placeholder="Harga"/>
        <div class="trash-icon" onclick="this.parentElement.remove(); saveData();">🗑️</div>
      `;
      document.getElementById("areaList").appendChild(item);
      saveData();
    }

    function exportAsImage() {
      const exportButton = document.getElementById("exportButton");
      exportButton.classList.add("loading-button");
      exportButton.innerHTML = "🔄 Sedang Mengunduh...";

      const currentDate = new Date();
      const dateString = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}-${String(currentDate.getHours()).padStart(2, '0')}${String(currentDate.getMinutes()).padStart(2, '0')}${String(currentDate.getSeconds()).padStart(2, '0')}`;
      const fileName = `pricelist-${dateString}.png`;

      html2canvas(document.getElementById("capture"), {
        backgroundColor: "#00a9a5",
        scale: 2
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = fileName;
        link.href = canvas.toDataURL();
        link.click();

        exportButton.classList.remove("loading-button");
        exportButton.innerHTML = "🖼️ Ekspor ke Gambar";
      });
    }

    function saveData() {
      const items = document.querySelectorAll('.area-item');
      const areaData = [];
      items.forEach(item => {
        const spans = item.querySelectorAll('span');
        const hargaInput = item.querySelector('input');
        areaData.push({
          area: spans[0].innerText,
          kuota: spans[1].innerText,
          harga: hargaInput.value
        });
      });
      const data = {
        judul: document.getElementById('judul').innerText,
        subjudul: document.getElementById('subjudul').innerText,
        kategori: document.getElementById('kategori').innerText,
        areaList: areaData
      };
      localStorage.setItem('pricelistData', JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem('pricelistData');
      if (!saved || saved === "undefined") {
        addColumn({ area: '⭐ AREA 1', kuota: '2.5 GB', harga: '10000' });
        addColumn({ area: '⭐ AREA 2', kuota: '3.5 GB', harga: '15000' });
        return;
      }
      const data = JSON.parse(saved);
      document.getElementById('judul').innerText = data.judul || 'Pricelist Harian';
      document.getElementById('subjudul').innerText = data.subjudul || '';
      document.getElementById('kategori').innerText = data.kategori || '';
      document.getElementById('areaList').innerHTML = '';
      data.areaList.forEach(item => addColumn(item));
    }

    window.onload = loadData;
    document.getElementById('judul').addEventListener('input', saveData);
    document.getElementById('subjudul').addEventListener('input', saveData);
    document.getElementById('kategori').addEventListener('input', saveData);
  </script>
</body>
</html>
